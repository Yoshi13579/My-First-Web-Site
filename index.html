<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoshi.S | Profile</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      color: #1f2933;
      background: #f4f6f8;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 24px;
    }

    .hero {
      display: grid;
      gap: 20px;
      padding: 40px 0;
      border-bottom: 1px solid #d8dee6;
    }

    .eyebrow {
      margin: 0;
      color: #52616f;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 1.05;
    }

    .lead {
      max-width: 620px;
      margin: 0;
      color: #36454f;
      font-size: 1.25rem;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }

    section {
      padding: 22px;
      border: 1px solid #d8dee6;
      border-radius: 8px;
      background: #ffffff;
    }

    h2 {
      margin: 0 0 8px;
      color: #102a43;
      font-size: 1rem;
    }

    p {
      margin: 0;
      color: #435565;
      font-size: 1rem;
    }

    .message {
      margin-top: 16px;
      padding: 28px;
      color: #ffffff;
      background: #1f2933;
      border-radius: 8px;
    }

    .message h2,
    .message p {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">Personal Profile</p>
      <h1>Yoshi.S</h1>
      <p class="lead">Thank you for visiting my website. I am interested in making websites and learning how to share ideas clearly.</p>
    </header>

    <div class="profile-grid">
      <section>
        <h2>Interest</h2>
        <p>Making Website</p>
      </section>

      <section>
        <h2>Skill</h2>
        <p>Debate</p>
      </section>

      <section>
        <h2>Style</h2>
        <p>Be Smart</p>
      </section>
    </div>

    <section class="message">
      <h2>Message</h2>
      <p>Welcome. I hope this page gives you a simple introduction to who I am and what I enjoy.</p>
    </section>
  </main>
</body>
</html>
